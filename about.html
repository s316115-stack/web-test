<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>許雅婷 // CYBER-ROBOT PROFILE</title>
    <style>
        /* 1. 基礎設定與電競主題配色 */
        :root {
            --primary: #00f3ff;    /* 賽博青 */
            --secondary: #ff007f;  /* 霓虹粉 */
            --bg-dark: #080b10;    /* 極致暗黑底 */
            --card-bg: rgba(13, 18, 28, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景微光與格線動畫 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        /* 2. 核心 3D HUD 卡片容器 */
        .card-container {
            perspective: 1000px;
            padding: 20px;
        }

        .cyber-card {
            width: 360px;
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 35px 25px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.1s ease-out, box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }

        /* 切角 HUD 裝飾條 */
        .cyber-card::after {
            content: 'SYSTEM ONLINE';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--secondary);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 12px;
            letter-spacing: 2px;
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
        }

        /* 3. 核心標題與超連結 */
        .title-wrapper {
            margin-bottom: 25px;
        }

        .cyber-link {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .name-main {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-icon {
            font-size: 1.5rem;
            color: var(--primary);
            transition: transform 0.3s ease;
        }

        .cyber-link:hover .name-main {
            color: var(--primary);
            text-shadow: 0 0 20px #ffffff, 0 0 40px var(--primary);
        }

        .cyber-link:hover .link-icon {
            transform: scale(1.3) rotate(15deg);
            color: var(--secondary);
        }

        .name-sub {
            font-size: 0.8rem;
            color: var(--secondary);
            letter-spacing: 3px;
            font-weight: 700;
            margin-top: 4px;
        }

        /* 4. 機器人 Avatar 頭像區域 */
        .robot-avatar-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* 旋轉 HUD 光環 */
        .hud-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed var(--primary);
            border-radius: 50%;
            animation: rotateHUD 20s linear infinite;
        }

        .hud-ring-inner {
            position: absolute;
            width: 82%;
            height: 82%;
            border: 2px solid var(--secondary);
            border-radius: 50%;
            border-left-color: transparent;
            border-right-color: transparent;
            animation: rotateHUD 8s linear infinite reverse;
        }

        @keyframes rotateHUD {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 機器人 SVG 圖案 */
        .robot-svg {
            width: 110px;
            height: 110px;
            z-index: 2;
            filter: drop-shadow(0 0 10px var(--primary));
            transition: transform 0.3s ease;
        }

        .robot-avatar-wrapper:hover .robot-svg {
            transform: scale(1.1);
            filter: drop-shadow(0 0 18px var(--secondary));
        }

        /* 5. 電競按鈕 */
        .action-btn {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(255, 0, 127, 0.2));
            border: 1px solid var(--primary);
            color: #ffffff;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 25px var(--primary);
            transform: translateY(-2px);
        }

        /* 6. 超連結跳轉後的語音 Modal / 畫面 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(8, 11, 16, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--secondary);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.4);
            position: relative;
        }

        .speech-title {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary);
            margin: 15px 0;
        }

        /* 音波動畫效果 */
        .wave-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            height: 30px;
            align-items: center;
            margin: 20px 0;
        }

        .wave-bar {
            width: 4px;
            height: 100%;
            background: var(--secondary);
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
